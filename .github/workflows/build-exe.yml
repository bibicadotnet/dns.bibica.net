name: Build DNS Bibica EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Loader and Build EXE
        shell: pwsh
        run: |
          # 1. Create the loader script (Stub)
          $loader_script = @"
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor 3072
          if (-not ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              `$exePath = [System.Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
              if (`$exePath -like "*powershell.exe*") {
                  Start-Process powershell.exe "-NoProfile -ExecutionPolicy Bypass -Command `"irm https://go.bibica.net/dns-bibica-net | iex`"" -Verb RunAs
              } else {
                  Start-Process "`$exePath" -Verb RunAs
              }
              exit
          }
          Write-Host "--- Connecting to Bibica.net (Secure TLS 1.2) ---" -ForegroundColor Cyan
          try {
              irm https://go.bibica.net/dns-bibica-net | iex
          } catch {
              Write-Host "ERROR: Failed to download the latest script." -ForegroundColor Red
              Read-Host "Press Enter to exit"
          }
          "@
          
          Set-Content -Path "loader-stub.ps1" -Value $loader_script -Encoding UTF8

          # 2. Install ps2exe
          Install-Module -Name ps2exe -Force -Scope CurrentUser

          # 3. Compile to EXE
          ps2exe .\loader-stub.ps1 .\dns.bibica.net.exe `
            -Title "dns.bibica.net" `
            -Description "Auto-update DoH & DPI Bypass" `
            -Company "Bibica.net" `
            -Product "dns.bibica.net" `
            -Copyright "2026 Bibica.net"

      - name: Upload EXE to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dns.bibica.net-installer
          path: dns.bibica.net.exe

      - name: Create GitHub Release
        if: github.event_name == 'push' && contains(github.ref, 'main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: dns.bibica.net.exe # Bỏ dấu .\ ở đây
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
